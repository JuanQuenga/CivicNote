<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f5ef" />
    <title>Offline — CivicNote</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f8f5ef; color: #18181b; }
      * { box-sizing: border-box; }
      body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 560px); border: 1px solid #e4e4e7; border-radius: 32px; background: white; padding: clamp(28px, 7vw, 52px); box-shadow: 0 24px 70px rgb(24 24 27 / 8%); }
      .mark { display: grid; width: 48px; height: 48px; place-items: center; border-radius: 16px; background: #b91c1c; color: white; font-weight: 900; font-size: 22px; }
      .eyebrow { margin: 30px 0 0; color: #b91c1c; font-size: 11px; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 12px 0 0; font-size: clamp(40px, 9vw, 64px); line-height: .94; letter-spacing: -.055em; }
      p { margin: 20px 0 0; color: #52525b; line-height: 1.7; }
      button { margin-top: 26px; min-height: 48px; border: 0; border-radius: 12px; background: #18181b; color: white; padding: 0 20px; font: inherit; font-size: 12px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">C</div>
      <p class="eyebrow">Connection unavailable</p>
      <h1>CivicNote is offline.</h1>
      <p>This page was not saved on this device. Reconnect to open it, or return to a previously loaded CivicNote feed for cached civic alerts.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
